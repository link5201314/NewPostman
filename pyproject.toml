[project]
name = "newpostman"
version = "0.1.0"
description = "輕量桌面 API 測試工具，聚焦參數化與批次鏈式執行"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonpath-ng>=1.11.0",
    "pydantic>=2.14.1",
    "pyside6>=6.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newpostman"]

[tool.hatch.build.targets.wheel.force-include]
"newpostman/py.typed" = "newpostman/py.typed"

[project.scripts]
newpostman = "newpostman.app:main"

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nuitka>=4.3.1",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]
